# CPU pipeline smoke test with a tiny random Qwen2 model. Results are meaningless.
base: gate0.yaml
experiment: smoke
model: trl-internal-testing/tiny-Qwen2ForCausalLM-2.5
data_dir: data/smoke
results_dir: results/smoke
seeds: [0, 1]

data:
  n_train: 32

train:
  bf16: false
  per_device_batch_size: 4
  grad_accum: 1
  max_steps: 4

eval:
  backend: hf
  hf_batch_size: 8
  sets:
    gsm8k_test: {file: eval_gsm8k_test.jsonl, max_new_tokens: 32}
    math500:    {file: eval_math500.jsonl,    max_new_tokens: 32}

analysis:
  n_boot: 200
