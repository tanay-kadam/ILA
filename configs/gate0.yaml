# Gate 0 / preliminary Gate 1: does the reasoning *style* of SFT targets change
# inference cost on unseen questions, and does structure matter at matched length?
# Decision thresholds below are fixed before any run; do not edit after seeing results.

experiment: gate0
model: Qwen/Qwen2.5-0.5B          # base (not instruct): output style comes from SFT only
data_dir: data/gate0
results_dir: results/gate0

styles: [concise, detailed, verify, backtrack, resolve]
seeds: [0, 1, 2]

data:
  n_train: 3000                   # same questions for every style
  selection_seed: 0
  min_ratio: 1.6                  # matched styles are >= 1.6x the concise length
  tol: 0.10                       # max relative token-length deviation among matched styles
  max_target_tokens: 768

train:
  method: lora                    # lora | full
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  learning_rate: 2.0e-4
  epochs: 2
  per_device_batch_size: 8
  grad_accum: 2
  max_len: 1024
  warmup_ratio: 0.03
  lr_scheduler: cosine
  weight_decay: 0.0
  bf16: true
  max_steps: -1

eval:
  backend: hf                     # vllm | hf  (seeklab-01 driver is CUDA 12.7; vLLM 0.30 needs CUDA 13)
  hf_batch_size: 64
  sets:
    gsm8k_test: {file: eval_gsm8k_test.jsonl, max_new_tokens: 1024}
    math500:    {file: eval_math500.jsonl,    max_new_tokens: 2048}

analysis:
  primary_set: gsm8k_test
  n_boot: 10000
  boot_seed: 12345
  gate0:
    min_seed_sd_multiple: 3.0     # |delta| must exceed 3x between-seed SD of concise
  gate1:
    pass_rel: 0.10                # >=10% token difference vs detailed => structure matters
    fail_rel: 0.05                # all <5% (or CIs include 0) => explained by length
